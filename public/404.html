<!DOCTYPE html>
<html lang="{{_lang.current}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{notfound.title}}</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<style>
  :root{ --cielo: #8BD4F4; }
  *{ box-sizing: border-box; }
  body{
    margin: 0; min-height: 100vh; min-height: 100svh;
    display: grid; place-items: center; padding: 32px 16px;
    font-family: 'League Spartan', system-ui, sans-serif; color: #fff;
    background: linear-gradient(145deg, var(--azul-medianoche, #071B30) 0%, var(--azul-oscuro, #0B2A4A) 55%, var(--azul-rey, #1C87C9) 160%);
  }
  main{ width: 100%; max-width: 560px; text-align: center; }
  .logo{ display: block; width: 150px; height: auto; margin: 0 auto 40px; }
  .code{ font-size: clamp(5rem, 22vw, 8.5rem); font-weight: 800; line-height: .9; letter-spacing: -4px; color: var(--cielo); }
  .plane{ display: inline-block; font-size: .35em; vertical-align: middle; margin-left: 8px; transform: rotate(-12deg); color: #fff; }
  h1{ font-size: clamp(1.7rem, 6vw, 2.3rem); line-height: 1.1; margin: 20px 0 12px; letter-spacing: -.5px; }
  p{ font-size: 1.15rem; line-height: 1.5; color: rgba(255,255,255,.82); margin: 0 auto 32px; max-width: 40ch; }
  .actions{ display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn{
    display: inline-flex; align-items: center; justify-content: center; min-height: 48px;
    padding: 12px 26px; border-radius: 999px; font: inherit; font-weight: 700; font-size: 1.05rem;
    text-decoration: none; transition: transform .3s, background .3s, border-color .3s;
  }
  .btn:hover{ transform: translateY(-2px); }
  .btn-primary{ background: var(--azul-rey, #1C87C9); color: #fff; }
  .btn-outline{ border: 1px solid rgba(255,255,255,.45); color: #fff; }
  .btn-outline:hover{ border-color: #fff; }
  .lang{ margin-top: 40px; display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.08); }
  .lang a{
    border: 0; border-radius: 999px; padding: 6px 14px; text-decoration: none;
    font: inherit; font-weight: 600; color: rgba(255,255,255,.75); background: transparent;
  }
  .lang a[aria-current="true"]{ background: #fff; color: var(--azul-oscuro, #0B2A4A); }
  :focus-visible{ outline: 2px solid var(--cielo); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce){ .btn{ transition: none; } .btn:hover{ transform: none; } }
</style>
</head>
<body>
<main>
  <a href="/" aria-label="Reyssi Travels"><img class="logo" src="/img/logo-blanco.png" alt="Reyssi Travels"></a>
  <div class="code" aria-hidden="true">404<span class="plane">✈</span></div>

  <h1>{{notfound.heading}}</h1>
  <p>{{notfound.text}}</p>

  <div class="actions">
    <a class="btn btn-primary" href="/">{{notfound.home}}</a>
    <a class="btn btn-outline" href="/viajes">{{notfound.packages}}</a>
    <a class="btn btn-outline" href="https://wa.me/525514846761" target="_blank" rel="noopener">{{notfound.whatsapp}}</a>
  </div>

  <nav class="lang" aria-label="Idioma / Language">
    <a href="?lang=es" hreflang="es" lang="es" data-l="es">Español</a>
    <a href="?lang=en" hreflang="en" lang="en" data-l="en">English</a>
  </nav>
</main>
<script>
document.querySelectorAll('.lang a').forEach(function(a){ if(a.dataset.l === document.documentElement.lang) a.setAttribute('aria-current', 'true'); });
</script>
</body>
</html>
